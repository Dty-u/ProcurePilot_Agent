[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurepilot-agent"
version = "0.1.0"
description = "Evidence-backed enterprise procurement agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiomysql",
    "alembic",
    "deepagents==0.4.12",
    "fastapi",
    "httpx",
    "langchain-openai==1.6.0",
    "langgraph-checkpoint-mysql[aiomysql,asyncmy]==3.0.0",
    "mcp==2.2.0",
    "opensandbox==0.1.16",
    "pydantic-settings",
    "PyYAML",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "types-PyYAML",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurepilot", "src/mcp_server", "src/agent", "src/api_view"]

[tool.hatch.build.targets.wheel.force-include]
"src/skills" = "skills"

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["src/tests"]
markers = [
    "live_model: calls the explicitly configured real model and is opt-in",
    "opensandbox_live: calls a real OpenSandbox server and is opt-in",
]

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
exclude = ["^src/tests/"]
mypy_path = "src"
python_version = "3.11"
strict = true
warn_unreachable = true
