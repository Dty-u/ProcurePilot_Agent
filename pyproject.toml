[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "procurepilot-agent"
version = "0.1.0"
description = "Evidence-backed enterprise procurement agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiomysql",
    "alembic",
    "deepagents==0.4.12",
    "fastapi",
    "httpx",
    "langchain-openai==1.6.0",
    "langgraph-checkpoint-sqlite",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/procurepilot"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
python_version = "3.11"
strict = true
warn_unreachable = true
